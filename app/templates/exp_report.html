{% extends "base.html" %}
{% block content %}
<div class="toolbar"><a class="linkbtn" href="/exp">→ חזרה לרשימת הדוחות</a></div>

<div id="reportHead"></div>

<div class="cards" style="max-width:900px">
  <section class="card">
    <div class="rowbetween">
      <h2>חשבוניות</h2>
      <div id="addArea"></div>
    </div>
    <div id="ocrMsg" class="ocrmsg" style="display:none"></div>
    <table class="grid" id="linesTable"><thead><tr>
      <th style="width:44px">מס׳</th><th style="width:52px">מסמך</th><th style="width:140px">תאריך</th>
      <th>ספק</th><th style="width:104px">סכום ₪</th><th style="width:128px">סיווג</th><th>הערה</th><th style="width:140px"></th>
    </tr></thead><tbody id="linesBody"></tbody></table>
    <div class="totalbar">סה"כ: <b id="grandTotal">₪ 0.00</b></div>
  </section>

  <section class="card" id="actionsCard">
    <h2>הפקה ושליחה</h2>
    <div class="actions">
      <button id="btnProduce" onclick="produce()"></button>
      <a class="linkbtn" id="btnPdf" href="#" target="_blank">⬇ הורד PDF</a>
      <button id="btnCancel" class="danger" onclick="deleteReport()" style="display:none">בטל דוח</button>
    </div>
    <div class="sendrow">
      <input id="sendEmail" type="email" placeholder="שליחה למייל נוסף (למשל הנהלת חשבונות)">
      <button class="secondary" onclick="sendToEmail()">שלח למייל</button>
    </div>
    <p class="hint" id="sentNote"></p>
  </section>
</div>
{% endblock %}

{% block scripts %}
<script>
const RID = {{ rid }};
let DATA = null;
const STATUS = {draft:["בהכנה","st-draft"], pending:["ממתין לאישור","st-pending"],
  approved:["אושר","st-approved"], rejected:["נדחה","st-rejected"], compiled:["רוכז","st-compiled"]};
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>(
  {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function money(n){ return (Number(n)||0).toLocaleString('he-IL',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function setTotal(t){ document.getElementById('grandTotal').textContent = '₪ ' + money(t); }

async function load(){
  DATA = await fetch('/exp/api/report/'+RID).then(r=>r.json());
  if(DATA.error){ alert(DATA.error); return; }
  renderHead(); renderAdd(); renderLines(); renderActions();
}

function catOptions(sel){
  return '<option value="">— סיווג —</option>' + (DATA.categories||[]).map(c=>
    `<option value="${c.id}" ${c.id===sel?'selected':''}>${esc(c.name)}</option>`).join('');
}

function renderHead(){
  const r = DATA.report, s = STATUS[r.status]||[r.status,'st-draft'];
  const isReimb = r.type==='reimbursement';
  const lock = r.editable ? '' : 'disabled';
  const deptList = (DATA.departments||[]).map(x=>`<option value="${esc(x)}">`).join('');
  document.getElementById('reportHead').innerHTML = `
    <h1>${esc(r.title)} <span class="stbadge ${s[1]}">${s[0]}</span></h1>
    <div class="headgrid">
      <label>שם הטופס<input id="h-title" value="${esc(r.title)}" ${lock}></label>
      <label>חודש<input id="h-month" type="month" value="${esc(r.month)}" ${lock}></label>
      ${isReimb ? `
      <label>מחלקה<input id="h-dept" list="dl" value="${esc(r.department)}" ${lock}>
        <datalist id="dl">${deptList}</datalist></label>
      <label>מנהל מאשר <span class="ro-tag">נקבע ע״י מנהל המערכת</span>
        <input value="${esc(r.approver_name || '— לא הוקצה —')}" disabled></label>` : ''}
    </div>
    ${r.cancellable ? `<button class="secondary sm" style="margin-top:6px" onclick="convertType()">↔ המר ל${isReimb?'ריכוז אשראי':'החזר הוצאות'}</button>` : ''}
    ${r.status==='rejected' && r.decision_note ? `<div class="rejnote">הדוח נדחה: ${esc(r.decision_note)}</div>`:''}
    ${!r.editable ? `<p class="hint">הדוח אינו ניתן לעריכה בסטטוס זה. ניתן עדיין להוריד PDF ולשלוח במייל.</p>`:''}
  `;
  if(r.editable){
    ['h-title','h-month','h-dept'].forEach(id=>{
      const el=document.getElementById(id); if(el) el.addEventListener('change', saveHead);
    });
  }
}

async function saveHead(){
  const g=id=>{const e=document.getElementById(id);return e?e.value:undefined;};
  await apiPost('/exp/api/report/'+RID+'/update', {
    title:g('h-title'), month:g('h-month'), department:g('h-dept') });
}

async function convertType(){
  const to = DATA.report.type==='reimbursement' ? 'credit' : 'reimbursement';
  const name = to==='credit' ? 'ריכוז אשראי' : 'החזר הוצאות';
  if(!confirm('להמיר את הדוח ל"'+name+'"? הדוח יחזור למצב טיוטה לעריכה — החשבוניות נשמרות, ותוכל לשלוח לאישור מחדש.')) return;
  const res = await apiPost('/exp/api/report/'+RID+'/convert', {type: to});
  if(res && res.error){ alert(res.error); return; }
  location.reload();
}

function renderAdd(){
  if(!DATA.report.editable){ document.getElementById('addArea').innerHTML=''; return; }
  document.getElementById('addArea').innerHTML = `
    <label class="camera">📷 צלם/העלה חשבונית
      <input type="file" accept="image/*,application/pdf" capture="environment" style="display:none" onchange="uploadInvoice(this)">
    </label>
    <span class="hint" style="margin:0">חובה לצרף מסמך לכל הוצאה</span>`;
}

async function uploadInvoice(input){
  const file = input.files[0]; if(!file) return;
  const msg = document.getElementById('ocrMsg');
  msg.style.display='block'; msg.textContent='מעלה וקורא חשבונית…';
  const fd = new FormData(); fd.append('file', file);
  try{
    const r = await fetch('/exp/api/report/'+RID+'/line', {method:'POST',
      headers:{'X-User': encodeURIComponent(getUser()||'אנונימי')}, body:fd});
    const res = await r.json();
    if(!r.ok){ throw new Error(res.error||'שגיאה'); }
    if(res.ocr.engine==='none') msg.textContent='חשבונית נוספה. מלא ספק וסכום ידנית (זיהוי אוטומטי כבוי).';
    else if(res.ocr.engine.indexOf('error')>=0) msg.textContent='חשבונית נוספה, אך הזיהוי האוטומטי נכשל — מלא ידנית.';
    else msg.textContent='זוהה: ' + (res.ocr.supplier||'—') + ' · ₪ ' + money(res.ocr.amount) + ' (ניתן לתקן).';
    input.value='';
    syncAllRows();                 // keep already-typed values on existing rows
    DATA.lines.push(res.line); setTotal(res.total); renderLines();
  }catch(e){ msg.textContent='שגיאה: '+e.message; }
}

function renderLines(){
  const editable = DATA.report.editable;
  const body = document.getElementById('linesBody');
  if(!DATA.lines.length){ body.innerHTML='<tr><td colspan="9" class="empty">עדיין אין חשבוניות.</td></tr>';
    setTotal(DATA.report.total); return; }
  const cancellable = DATA.report.cancellable;
  body.innerHTML = DATA.lines.map(l=>`
    <tr data-id="${l.id}">
      <td class="c" data-label="מס׳">${l.seq}</td>
      <td class="c" data-label="מסמך">${l.has_image?`<a href="/exp/report/${RID}/line/${l.id}/image" target="_blank">📄 צפייה</a>`:'—'}</td>
      <td data-label="תאריך"><input class="f-date" type="date" value="${esc(l.date||'')}" ${editable?'':'disabled'}></td>
      <td data-label="ספק"><input class="f-sup" placeholder="שם הספק" value="${esc(l.supplier)}" ${editable?'':'disabled'}></td>
      <td data-label="סכום ₪"><input class="f-amt" type="number" step="0.01" value="${l.amount}" ${editable?'':'disabled'}></td>
      <td data-label="סיווג"><select class="f-cat" ${editable?'':'disabled'}>${catOptions(l.category_id)}</select></td>
      <td data-label="הערה"><input class="f-note" placeholder="הערה (אופציונלי)" value="${esc(l.note||'')}" ${editable?'':'disabled'}></td>
      <td class="c actions-cell">
        ${editable?`<button class="secondary sm" onclick="saveLine(this.closest('tr'),this)">שמור</button>`:''}
        ${cancellable?`<button class="danger sm" onclick="delLine(this)">בטל</button>`:''}
      </td>
    </tr>`).join('');
  if(editable){
    body.querySelectorAll('tr').forEach(tr=>{
      tr.querySelectorAll('.f-date,.f-sup,.f-amt,.f-cat,.f-note').forEach(el=>el.addEventListener('change',()=>saveLine(tr)));
    });
  }
  setTotal(DATA.report.total);
}

// keep the in-memory model in sync with what's typed, so re-rendering (e.g. after
// adding another invoice) never discards unsaved edits on existing rows.
function syncRow(tr){
  const l = DATA.lines.find(x=>String(x.id)===tr.dataset.id); if(!l) return;
  const q=s=>tr.querySelector(s);
  if(q('.f-date')) l.date=q('.f-date').value;
  if(q('.f-sup'))  l.supplier=q('.f-sup').value;
  if(q('.f-amt'))  l.amount=parseFloat(q('.f-amt').value)||0;
  if(q('.f-cat'))  l.category_id=q('.f-cat').value||null;
  if(q('.f-note')) l.note=q('.f-note').value;
}
function syncAllRows(){ document.querySelectorAll('#linesBody tr[data-id]').forEach(syncRow); }

async function saveLine(tr, btn){
  syncRow(tr);
  const res = await apiPost('/exp/api/report/'+RID+'/line/'+tr.dataset.id, {
    supplier: tr.querySelector('.f-sup').value,
    amount: parseFloat(tr.querySelector('.f-amt').value)||0,
    date: tr.querySelector('.f-date').value,
    note: tr.querySelector('.f-note').value,
    category_id: tr.querySelector('.f-cat').value || null });
  if(res && res.error){ alert(res.error); return; }
  if(res && res.total!=null) setTotal(res.total);
  if(btn){ const t=btn.textContent; btn.textContent='נשמר ✓'; setTimeout(()=>{btn.textContent=t;}, 1300); }
}
async function delLine(btn){
  if(!confirm('לבטל את השורה?')) return;
  const tr = btn.closest('tr');
  const res = await apiPost('/exp/api/report/'+RID+'/line/'+tr.dataset.id+'/delete',{});
  DATA = await fetch('/exp/api/report/'+RID).then(r=>r.json());
  renderLines();
}

function renderActions(){
  const r = DATA.report;
  document.getElementById('btnPdf').href = '/exp/report/'+RID+'/pdf';
  const btn = document.getElementById('btnProduce');
  if(!r.editable){ btn.style.display='none'; }
  else{
    btn.style.display='';
    btn.textContent = r.type==='credit' ? 'הפק טופס' : 'הפק טופס ושלח לאישור';
  }
  document.getElementById('btnCancel').style.display = r.cancellable ? '' : 'none';
  document.getElementById('sentNote').textContent =
    r.sent_to ? ('נשלח לאחרונה אל ' + r.sent_to) : '';
}

async function deleteReport(){
  if(!confirm('לבטל ולמחוק את הדוח כולו? פעולה זו אינה הפיכה.')) return;
  const res = await apiPost('/exp/api/report/'+RID+'/delete', {});
  if(res && res.error){ alert(res.error); return; }
  location.href = '/exp';
}

async function produce(){
  const r = DATA.report;
  if(!DATA.lines.length){ alert('אין חשבוניות בדוח'); return; }
  if(r.type==='reimbursement' && !r.approver_id){
    alert('לא הוקצה לך מנהל מאשר. פנה למנהל המערכת כדי שיקצה לך מאשר בהגדרות.'); return; }
  const verb = r.type==='credit' ? 'להפיק את הטופס?' : 'להפיק ולשלוח לאישור המנהל?';
  if(!confirm(verb)) return;
  const res = await apiPost('/exp/api/report/'+RID+'/submit', {});
  if(res.error){ alert(res.error); return; }
  if(r.type==='credit') alert('הטופס הופק. ניתן להוריד PDF או לשלוח במייל.');
  else alert(res.mail_sent ? 'הטופס נשלח לאישור המנהל.' :
    'הטופס הופק. המייל יישלח כשיוגדר שרת דואר (נשמר כרגע ב-outbox).');
  load();
}

async function sendToEmail(){
  const email = document.getElementById('sendEmail').value.trim();
  if(email.indexOf('@')<0){ alert('כתובת מייל לא תקינה'); return; }
  const res = await apiPost('/exp/api/report/'+RID+'/send', {email});
  if(res.error){ alert(res.error); return; }
  alert(res.mail_sent ? 'נשלח אל '+email : 'נשמר לשליחה (outbox) עד להגדרת שרת דואר.');
  document.getElementById('sentNote').textContent = 'נשלח לאחרונה אל ' + email;
}

load().catch(e=>alert('שגיאה: '+e.message));
</script>
{% endblock %}
