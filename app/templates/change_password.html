<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>שינוי סיסמה — {{ request.app.state.site_name }}</title>
<link rel="stylesheet" href="/static/fonts/assistant.css?v=1">
<link rel="stylesheet" href="/static/css/app.css?v=exp6">
<meta name="theme-color" content="#14367f">
<link rel="icon" href="/static/icons/favicon-64.png" sizes="64x64" type="image/png">
</head>
<body class="loginbg">
<form class="logincard" id="cpForm" onsubmit="return false">
  <div class="login-logo"><img src="/static/img/arkia-logo.png?v=1" alt="arkia"></div>
  <h1>שינוי סיסמה</h1>
  {% if forced %}
  <p class="login-sub">כניסה ראשונה — יש לבחור סיסמה חדשה משלך כדי להמשיך.</p>
  {% else %}
  <p class="login-sub">בחירת סיסמה חדשה לחשבון.</p>
  <label>סיסמה נוכחית<input id="current" type="password" autocomplete="current-password"></label>
  {% endif %}
  <label>סיסמה חדשה<input id="new" type="password" autocomplete="new-password"></label>
  <label>אימות סיסמה חדשה<input id="confirm" type="password" autocomplete="new-password"></label>
  <p class="hint" style="margin:2px 0 6px">לפחות 8 תווים.</p>
  <div class="err" id="err" style="display:none"></div>
  <button type="submit" id="btn">עדכון סיסמה</button>
  <div class="or" style="margin-top:10px"><a href="/logout">יציאה</a></div>
</form>
<script>
const FORCED = {{ 'true' if forced else 'false' }};
const err = document.getElementById('err');
function showErr(m){ err.textContent = m; err.style.display = 'block'; }
document.getElementById('cpForm').addEventListener('submit', async function(){
  err.style.display = 'none';
  const nw = document.getElementById('new').value;
  const cf = document.getElementById('confirm').value;
  const cur = FORCED ? '' : document.getElementById('current').value;
  if (nw.length < 8){ showErr('הסיסמה חייבת להכיל לפחות 8 תווים'); return; }
  if (nw !== cf){ showErr('אימות הסיסמה אינו תואם'); return; }
  const btn = document.getElementById('btn'); btn.disabled = true;
  try {
    const r = await fetch('/api/change-password', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({new_password: nw, confirm: cf, current_password: cur})});
    const res = await r.json().catch(()=>({}));
    if (!r.ok){ showErr(res.error || 'שגיאה'); btn.disabled = false; return; }
    location.href = '/exp';
  } catch(e){ showErr(e.message || 'שגיאה'); btn.disabled = false; }
});
</script>
</body>
</html>
