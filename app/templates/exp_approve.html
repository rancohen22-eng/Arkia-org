<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>אישור דוח · ארקיע</title>
<link rel="stylesheet" href="/static/css/app.css?v=exp1">
</head>
<body>
<header><div class="brand">ארקיע · אישור דוח החזרי הוצאות</div></header>
<main>
<div id="app" class="cards" style="max-width:760px"><p class="hint">טוען…</p></div>
</main>
<script>
const TOKEN = {{ token | tojson }};
const STATUS = {pending:["ממתין לאישור","st-pending"], approved:["אושר","st-approved"],
  rejected:["נדחה","st-rejected"]};
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>(
  {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function money(n){ return (Number(n)||0).toLocaleString('he-IL',{minimumFractionDigits:2,maximumFractionDigits:2}); }

async function load(){
  const d = await fetch('/exp/api/public/approve/'+encodeURIComponent(TOKEN)).then(r=>r.json());
  if(d.error){ document.getElementById('app').innerHTML='<div class="card">'+esc(d.error)+'</div>'; return; }
  const r = d.report, s = STATUS[r.status]||[r.status,'st-draft'];
  const rows = (d.lines||[]).map(l=>`<tr>
    <td class="c">${l.seq}</td><td class="c">${esc(l.date||'')}</td>
    <td>${esc(l.supplier)}${l.note?`<div style="font-size:11px;color:#64748b;margin-top:2px">${esc(l.note)}</div>`:''}</td>
    <td>${esc(l.category||'')}</td><td style="text-align:left;white-space:nowrap">${(l.currency_symbol||'₪')} ${money(l.amount)}</td></tr>`).join('')
    || '<tr><td colspan="5" class="empty">אין חשבוניות</td></tr>';
  const CUR={ILS:'₪',USD:'$',EUR:'€',GBP:'£',CHF:'CHF',JPY:'¥'};
  const ct={}; (d.lines||[]).forEach(l=>{const c=(l.currency||'ILS');ct[c]=(ct[c]||0)+(Number(l.amount)||0);});
  const totalStr = Object.keys(ct).length ? Object.keys(ct).map(c=>(CUR[c]||c)+' '+money(ct[c])).join('  ·  ') : '₪ '+money(0);
  const decided = r.status!=='pending';
  document.getElementById('app').innerHTML = `
    <section class="card">
      <h1 style="margin-top:0">${esc(r.title)} <span class="stbadge ${s[1]}">${s[0]}</span></h1>
      <table style="font-size:14px;margin-bottom:8px">
        <tr><td style="color:#64748b;padding:2px 10px 2px 0">עובד</td><td><b>${esc(r.owner_name)}</b></td></tr>
        <tr><td style="color:#64748b;padding:2px 10px 2px 0">מחלקה</td><td>${esc(r.department)}</td></tr>
        <tr><td style="color:#64748b;padding:2px 10px 2px 0">חודש</td><td>${esc(r.month)}</td></tr>
        <tr><td style="color:#64748b;padding:2px 10px 2px 0">סכום ההחזר</td>
            <td style="font-size:18px;font-weight:800;color:#123a86">${totalStr}</td></tr>
      </table>
      <table class="grid"><thead><tr><th style="width:44px">מס׳</th><th style="width:110px">תאריך</th><th>ספק</th>
        <th>סיווג</th><th style="width:120px">סכום</th></tr></thead><tbody>${rows}</tbody></table>
      <div class="toolbar"><a class="linkbtn" href="/exp/approve/${encodeURIComponent(TOKEN)}/pdf" download>
        ⬇ הורדת ה-PDF המלא (כולל מסמכים סרוקים)</a></div>
    </section>
    ${decided ? `<section class="card"><p>הדוח כבר טופל — סטטוס: <b>${s[0]}</b>.
        ${r.decision_note?('<br>הערה: '+esc(r.decision_note)):''}</p></section>`
      : `<section class="card">
        <h2>החלטה</h2>
        <textarea id="note" rows="2" placeholder="הערה (רשות, חובה בדחייה)"
          style="width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:9px;font-family:inherit"></textarea>
        <div class="actions" style="margin-top:10px">
          <button onclick="decide('approve')" style="background:#16a34a">✓ אשר דוח</button>
          <button class="danger" onclick="decide('reject')">✕ דחה דוח</button>
        </div>
      </section>`}`;
}

async function decide(decision){
  const note = (document.getElementById('note')||{}).value || '';
  if(decision==='reject' && !note.trim()){ alert('נא לציין סיבת דחייה'); return; }
  if(!confirm(decision==='approve'?'לאשר את הדוח?':'לדחות את הדוח?')) return;
  const r = await fetch('/exp/api/public/approve/'+encodeURIComponent(TOKEN), {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({decision, note})});
  const res = await r.json();
  if(!r.ok){ alert(res.error||'שגיאה'); return; }
  alert(decision==='approve'?'הדוח אושר. נשלח עדכון לעובד.':'הדוח נדחה. נשלח עדכון לעובד.');
  load();
}
load().catch(e=>document.getElementById('app').innerHTML='<div class="card">שגיאה: '+esc(e.message)+'</div>');
</script>
</body>
</html>
