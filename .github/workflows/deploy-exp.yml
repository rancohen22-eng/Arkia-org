name: Deploy expense system

# Any push to main also deploys the standalone expense service to /opt/arkia-exp
# on the Oracle server and restarts arkia-exp. It reuses the same three secrets as
# the org-chart deploy (SERVER_SSH_KEY / SERVER_HOST / SERVER_USER).
#
# NOTE: this only works once the one-time server setup in DEPLOY_EXP.md is done
# (the /opt/arkia-exp checkout, its .venv, its .env and the arkia-exp service must
# exist). Until then this job will fail on the restart step — that's expected.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-arkia-exp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Load deploy SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Trust server host key
        run: ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync code to server (never touches DB / secrets / venv)
        run: |
          rsync -az \
            --exclude '.git' --exclude '.github' \
            --exclude 'data' --exclude 'backups' \
            --exclude 'users.txt' --exclude '.env' --exclude '*.env' \
            --exclude '__pycache__' --exclude '*.pyc' --exclude '.venv' \
            ./ "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/opt/arkia-exp/"

      - name: Install deps and restart
        run: |
          ssh "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            'export PATH=$HOME/.local/bin:$PATH && cd /opt/arkia-exp && VIRTUAL_ENV=/opt/arkia-exp/.venv uv pip install -q -r requirements.txt && sudo systemctl restart arkia-exp && sleep 2 && systemctl is-active arkia-exp && curl -sS http://127.0.0.1:8021/health'
